<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>佐賀トヨペット 代車・スマイルパスポート</title>
<style>
:root{--red:#00873c;--red-d:#006b2f;--err:#c8102e;--ink:#1a1a1a;--mut:#666;--bg:#f3f8f4;--card:#fff;--line:#dcdcdc;--ok:#1e7a3c;--warn:#b26a00;--okbg:#e5f4ea;--warnbg:#fff1d6;--badbg:#fde4e6;--blue:#1d4f91;--bluebg:#e4edf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#f0f0f0;--mut:#a5a5a5;--bg:#161616;--card:#232323;--line:#3a3a3a;--okbg:#18321f;--warnbg:#3a2c0e;--badbg:#3d1519;--bluebg:#16283f;--ok:#6fd08c;--warn:#f0b24d;--blue:#8cb7ee}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#f0f0f0;--mut:#a5a5a5;--bg:#161616;--card:#232323;--line:#3a3a3a;--okbg:#18321f;--warnbg:#3a2c0e;--badbg:#3d1519;--bluebg:#16283f;--ok:#6fd08c;--warn:#f0b24d;--blue:#8cb7ee}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:10}
header{background:var(--red);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.hd{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.02em;flex:1;min-width:200px}
.logo small{display:block;font-weight:400;font-size:12px;opacity:.9}
.seg{display:inline-flex;background:rgba(0,0,0,.25);border-radius:8px;padding:3px}
.seg button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:6px;font:inherit;font-size:14px;cursor:pointer;min-height:36px}
.seg button.on{background:#fff;color:var(--red-d);font-weight:700}
main{max-width:980px;margin:auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:19px;margin:24px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin:12px 0}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:14px 0}
.tabs button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--red);border-color:var(--red)}
.steps{display:flex;gap:0;margin:8px 0 16px}
.st{flex:1;text-align:center;font-size:13px;color:var(--mut);position:relative}
.st i{display:block;width:30px;height:30px;line-height:30px;margin:0 auto 4px;border-radius:50%;background:var(--line);color:var(--ink);font-style:normal;font-weight:700}
.st.on i{background:var(--red);color:#fff}.st.on{color:var(--ink);font-weight:700}.st.done i{background:var(--ok);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.st span{display:none}}
label.f{display:block;font-weight:600;font-size:14px}
label.f .req{color:var(--err)}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:var(--ink);min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid rgba(0,135,60,.35);outline-offset:1px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--red);flex:none}
.btn{border:0;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer;min-height:46px}
.pri{background:var(--red);color:#fff}.pri:hover{background:var(--red-d)}
.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.ok{background:var(--ok);color:#fff}.bad{background:#fff;color:var(--err);border:1px solid var(--err)}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700}
.s-pending{background:var(--warnbg);color:var(--warn)}.s-approved{background:var(--bluebg);color:var(--blue)}.s-allotted,.s-returned{background:var(--okbg);color:var(--ok)}.s-rejected{background:var(--badbg);color:var(--err)}
.req{cursor:pointer}.req:hover{border-color:var(--red)}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--red);border-radius:8px;padding:10px 14px}.stat b{font-size:26px;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}.chips button.on{background:var(--red);color:#fff;border-color:var(--red)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:15px}.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word}
@media(max-width:640px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
canvas{width:100%;height:150px;border:2px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;display:block}
.tl{display:flex;gap:6px;margin:10px 0;font-size:13px}.tl span{flex:1;text-align:center;padding:6px 2px;border-radius:6px;background:var(--line);color:var(--mut)}.tl span.on{background:var(--ok);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:8px;z-index:20;max-width:90%}
.hint{background:var(--okbg);color:var(--ok);padding:10px 14px;border-radius:8px;font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.g3 .card{margin:0}@media(max-width:640px){.g3{grid-template-columns:1fr}}.tb{border-collapse:collapse;font-size:13px;width:100%;background:var(--card)}.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:center}.tb td:first-child{text-align:left;min-width:200px}.tb th small{font-weight:400;color:var(--mut)}.pr{font-size:24px;font-weight:800}
</style>
</head>
<body>
<header><div class="hd">
<div class="logo">佐賀トヨペット<small id="sub"></small></div>
<div class="seg" id="roleSeg"></div>
<div class="seg" id="langSeg"></div>
</div></header>
<main id="app"></main>
<div id="toast"></div>
<script>
const T={ja:{sub:"代車ご利用 Web手続き",cust:"お客様",staff:"佐賀トヨペット（スタッフ）",
new:"新規お申込み",my:"お申込み状況",dash:"受付一覧",
s0:"ご利用内容",s1:"お客様情報",s2:"確認・同意",s3:"署名・送信",
ttl:"代車のお申込み",lead:"紙の書類はもう不要です。画面の案内に沿って入力してください。",
store:"ご利用店舗",reason:"ご利用の理由",r_shaken:"車検",r_insp:"定期点検",r_rep:"修理・板金",r_oth:"その他",
carName:"お客様のお車（車種名）",plate:"登録番号",from:"貸出開始日",to:"返却予定日",
name:"お名前",kana:"フリガナ",zip:"郵便番号",addr:"ご住所",tel:"電話番号",email:"メール（任意）",
termsT:"貸出車両に関する留意事項",
terms:["貸出車両は、十分な注意・責任を持って管理します。","万一の事故の際は、ご自身が加入されている自動車保険を優先して対応・お支払いします。その際の代車修理は当社へ入庫します。","貸出車両の又貸しはしません（ご自身の保険の適用外となります）。","貸出車両はすべて禁煙車です。ペットの同乗も控えます。","不具合を感じた際は、速やかに運行を中止し連絡します。","ドライブレコーダー搭載車は録音・録画が機能していることを了承します。"],
excess:"※お客様の保険で対応できない場合は、免責金額（上限10万円）をご負担いただきます。",
shakenT:"車検に関する確認事項",fine:"放置違反金の滞納情報について、自動車整備振興会を通じて警察に照会・確認することに同意します。",ctype:"車両の種別",kei:"軽自動車",reg:"登録自動車",two:"二輪車",
ep1:"電子的方法による継続検査の申請を、申請代理人に委任します。",ep2:"保安基準適合証・自賠責保険証明書の記載事項を電子的方法で提供することを承諾します。",
antT:"確認書（佐賀県暴力団排除条例）",ant:["私は、暴力団、暴力団員、暴力団関係企業・団体またはこれらの密接交際者、及び過去に違法・不当な要求行為を行った履歴のある者ではありません。","今後「反社会的勢力」との関わりが認められた場合、一切の契約の解除に応じ、貸与物品を速やかに返却し、損害賠償を請求しないことに同意します。"],
agree:"はい",sigT:"ご署名（指またはマウスで記入）",clear:"書き直す",sigNote:"署名日：",review:"内容のご確認",
back:"戻る",next:"次へ",submit:"この内容で申し込む",
errReq:"未入力の項目があります。",errDate:"返却日は開始日以降にしてください。",errAgree:"すべての項目に同意してください。",errCt:"車両の種別と同意にチェックしてください。",errSig:"署名をお願いします。",
done:"お申込みを受け付けました。店頭でお待ちしております。",
none:"まだお申込みはありません。",id:"受付番号",period:"期間",car:"お客様のお車",
pending:"確認待ち",approved:"承認済み",rejected:"お断り",allotted:"貸出中",returned:"返却済み",
all:"すべて",tl:["申込","承認","貸出","返却"],
loaner:"貸出車両",note:"スタッフからのメッセージ",bringId:"ご来店時は運転免許証をお持ちください。車両は店頭でお渡しします。",
detail:"申込内容",agreed:"同意済み",notag:"未同意",sig:"署名",
approve:"承認する",reject:"お断りする",noteIn:"お客様へのメッセージ（任意）",
allot:"車両を割り当てる",pick:"車両を選択",handover:"貸出する（店頭でお渡し）",ret:"返却を受け付ける",close:"閉じる",
fleet:"貸出可能車両",busy:"貸出中",free:"空き",
stat:["確認待ち","承認済み","貸出中","返却済み"],
demo:"デモ：お客様画面で申込み → スタッフ画面で承認・車両割当の流れをお試しください。",
sec:"署名画像",ct:"車両種別",unit:"店舗"},
en:{sub:"Loaner car online procedure",cust:"Customer",staff:"Saga Toyopet (Staff)",
new:"New request",my:"My requests",dash:"Requests",
s0:"Rental details",s1:"Your details",s2:"Review & agree",s3:"Sign & send",
ttl:"Request a loaner car",lead:"No more paper forms. Just follow the steps on screen.",
store:"Store",reason:"Reason for rental",r_shaken:"Vehicle inspection (Shaken)",r_insp:"Periodic check",r_rep:"Repair / body work",r_oth:"Other",
carName:"Your car (model name)",plate:"Registration number",from:"Start date",to:"Return date",
name:"Full name",kana:"Furigana (reading)",zip:"Postal code",addr:"Address",tel:"Phone",email:"Email (optional)",
termsT:"Terms for the loaner vehicle",
terms:["I will manage the loaner vehicle with due care and responsibility.","In an accident, my own auto insurance applies first for handling and repair costs. The loaner will be repaired at Saga Toyopet.","I will not lend the loaner to others (it is not covered by my insurance).","All loaners are non-smoking. I will not bring pets.","If I notice a problem, I will stop driving and contact the store immediately.","I understand that vehicles with a dashcam record audio and video."],
excess:"If my insurance cannot cover it, I will bear the deductible (up to ¥100,000).",
shakenT:"Vehicle inspection confirmation",fine:"I consent to Saga Toyopet checking unpaid parking-violation fines for my vehicle with the police via the Automobile Maintenance Promotion Association.",ctype:"Vehicle type",kei:"Kei car",reg:"Registered car",two:"Motorcycle",
ep1:"I authorize electronic filing of the continued inspection to the filing agent.",ep2:"I consent to electronic provision of the safety-standard and compulsory insurance certificate data.",
antT:"Confirmation (Saga Anti-Organized-Crime Ordinance)",ant:["I am not a member of, or affiliated with, an organized crime group, nor have I a history of unlawful or unreasonable demands.","If any link to anti-social forces is found, I agree to cancel all contracts, return borrowed items promptly, and make no damage claims."],
agree:"Yes",sigT:"Signature (use finger or mouse)",clear:"Clear",sigNote:"Signed on: ",review:"Review",
back:"Back",next:"Next",submit:"Submit request",
errReq:"Some required fields are empty.",errDate:"Return date must be on or after the start date.",errAgree:"Please agree to all items.",errCt:"Select the vehicle type and consent.",errSig:"Please sign above.",
done:"Request received. We look forward to seeing you in store.",
none:"No requests yet.",id:"Request no.",period:"Period",car:"Your car",
pending:"Pending",approved:"Approved",rejected:"Declined",allotted:"On loan",returned:"Returned",
all:"All",tl:["Applied","Approved","On loan","Returned"],
loaner:"Loaner vehicle",note:"Message from staff",bringId:"Please bring your driver’s license. The car is handed over in person at the store.",
detail:"Request details",agreed:"Agreed",notag:"Not agreed",sig:"Signature",
approve:"Approve",reject:"Decline",noteIn:"Message to customer (optional)",
allot:"Allot a car",pick:"Select a vehicle",handover:"Hand over (in person)",ret:"Mark as returned",close:"Close",
fleet:"Loaner fleet",busy:"On loan",free:"Available",
stat:["Pending","Approved","On loan","Returned"],
demo:"Demo: submit as Customer, then switch to Saga Toyopet to approve and allot a car.",
sec:"Signature",ct:"Vehicle type",unit:"Store"}};
const STORES=[["佐賀店","Saga"],["唐津店","Karatsu"],["武雄店","Takeo"],["伊万里店","Imari"],["鹿島店","Kashima"],["鳥栖店","Tosu"]];
const FLEET=[["ピクシス エポック","Pixis Epoch","佐賀 580 あ 12-01"],["アクア","Aqua","佐賀 500 い 34-56"],["ヤリス","Yaris","佐賀 501 う 78-90"],["カローラ","Corolla","佐賀 300 え 11-22"],["ルーミー","Roomy","佐賀 500 お 33-44"],["アルファード","Alphard","佐賀 300 か 55-66"]];
const REASONS=["shaken","insp","rep","oth"];
let S={lang:"ja",role:"c",tab:"new",step:0,f:blank(),sel:null,flt:"all"};
function blank(){return{store:0,reason:"shaken",carName:"",plate:"",from:new Date().toISOString().slice(0,10),to:"",name:"",kana:"",zip:"",addr:"",tel:"",email:"",terms:[0,0,0,0,0,0],fine:0,ctype:"",ep:[0,0],ant:[0,0],sig:""}}
function seed(){const f=blank();f.name="佐賀 太郎";f.kana="サガ タロウ";f.zip="840-0801";f.addr="佐賀市駅前中央1-1-1";f.tel="090-1234-5678";f.carName="ハリアー";f.plate="佐賀 300 さ 12-34";f.to=new Date(Date.now()+864e5*2).toISOString().slice(0,10);f.terms=[1,1,1,1,1,1];f.fine=1;f.ctype="reg";f.ep=[1,1];f.ant=[1,1];return[{id:"R-1001",st:"pending",f,note:"",car:-1,at:Date.now()}]}
function load(){try{return JSON.parse(localStorage.getItem("stp_req"))||seed()}catch(e){return seed()}}
let R=load();
function save(){try{localStorage.setItem("stp_req",JSON.stringify(R))}catch(e){}}
const t=k=>T[S.lang][k];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sn=i=>STORES[i][S.lang==="ja"?0:1];
const fn=i=>FLEET[i][S.lang==="ja"?0:1]+" ("+FLEET[i][2]+")";
const stLabel=s=>`<span class="badge s-${s}">${t(s)}</span>`;
function toast(m){const e=document.getElementById("toast");e.innerHTML=`<div class="toast" role="alert">${esc(m)}</div>`;setTimeout(()=>e.innerHTML="",3200)}
function busy(i){return R.some(r=>r.car===i&&r.st==="allotted")}

function render(){
 document.documentElement.lang=S.lang;document.getElementById("sub").textContent=t("sub");
 document.getElementById("roleSeg").innerHTML=`<button class="${S.role==="c"?"on":""}" onclick="S.role='c';S.sel=null;render()">${t("cust")}</button><button class="${S.role==="s"?"on":""}" onclick="S.role='s';S.sel=null;render()">${t("staff")}</button>`;
 document.getElementById("langSeg").innerHTML=`<button class="${S.lang==="ja"?"on":""}" onclick="S.lang='ja';render()">日本語</button><button class="${S.lang==="en"?"on":""}" onclick="S.lang='en';render()">English</button>`;
 document.getElementById("app").innerHTML=S.role==="c"?customer():staff();
 if(S.role==="c"&&((S.mod==="loan"&&S.tab==="new"&&S.step===3)||(S.mod==="pass"&&S.pt==="new"&&S.ps===3)))initSig();
}
/* ---------- customer ---------- */
function customer(){
 if(S.mod==="pass")return passCust();
 return modSw()+`<h1>${t("ttl")}</h1><div class="mut">${t("lead")}</div>
 <div class="tabs"><button class="${S.tab==="new"?"on":""}" onclick="S.tab='new';render()">${t("new")}</button><button class="${S.tab==="my"?"on":""}" onclick="S.tab='my';render()">${t("my")} (${R.length})</button></div>`+(S.tab==="new"?wizard():myList());
}
function wizard(){
 const names=["s0","s1","s2","s3"];
 let h=`<div class="steps">${names.map((n,i)=>`<div class="st ${i===S.step?"on":i<S.step?"done":""}"><i>${i<S.step?"✓":i+1}</i><span>${t(n)}</span></div>`).join("")}</div><div class="card">`;
 const f=S.f;
 if(S.step===0){
  h+=`<div class="grid">
  <label class="f">${t("store")}<select onchange="S.f.store=+this.value">${STORES.map((s,i)=>`<option value="${i}" ${f.store===i?"selected":""}>${sn(i)}</option>`).join("")}</select></label>
  <label class="f">${t("reason")}<select onchange="S.f.reason=this.value">${REASONS.map(r=>`<option value="${r}" ${f.reason===r?"selected":""}>${t("r_"+r)}</option>`).join("")}</select></label>
  ${inp("carName",t("carName"),"text")}${inp("plate",t("plate"),"text","佐賀 300 あ 12-34")}
  ${inp("from",t("from"),"date")}${inp("to",t("to"),"date")}</div>`;
 }
 if(S.step===1){
  h+=`<div class="grid">${inp("name",t("name"),"text")}${inp("kana",t("kana"),"text")}${inp("zip",t("zip"),"text","840-0801")}${inp("tel",t("tel"),"tel")}</div><div style="margin-top:14px">${inp("addr",t("addr"),"text")}</div><div style="margin-top:14px">${inp("email",t("email"),"email")}</div>`;
 }
 if(S.step===2){
  h+=`<h2 style="margin-top:0">${t("termsT")}</h2>`+t("terms").map((x,i)=>chk(`S.f.terms[${i}]=this.checked?1:0`,f.terms[i],`${i+1}. ${x}`)).join("")+`<div class="mut">${t("excess")}</div>`;
  if(f.reason==="shaken"){
   h+=`<h2>${t("shakenT")}</h2><div class="mut">${t("ctype")}</div><div class="grid" style="grid-template-columns:repeat(3,1fr)">${["kei","reg","two"].map(k=>`<label class="chk" style="margin:4px 0"><input type="radio" name="ct" ${f.ctype===k?"checked":""} onchange="S.f.ctype='${k}'">${t(k)}</label>`).join("")}</div>`+chk("S.f.fine=this.checked?1:0",f.fine,t("fine"))+chk("S.f.ep[0]=this.checked?1:0",f.ep[0],t("ep1"))+chk("S.f.ep[1]=this.checked?1:0",f.ep[1],t("ep2"));
  }
  h+=`<h2>${t("antT")}</h2>`+t("ant").map((x,i)=>chk(`S.f.ant[${i}]=this.checked?1:0`,f.ant[i],`${["①","②"][i]} ${x} 【${t("agree")}】`)).join("");
 }
 if(S.step===3){
  h+=`<h2 style="margin-top:0">${t("review")}</h2>${summary(f)}<h2>${t("sigT")}</h2><canvas id="sig" aria-label="${t("sigT")}"></canvas>
  <div class="row" style="margin-top:8px"><span class="mut">${t("sigNote")}${new Date().toLocaleDateString(S.lang==="ja"?"ja-JP":"en-GB")}</span><button class="btn sec" onclick="clearSig()">${t("clear")}</button></div>`;
 }
 h+=`<div class="row"><button class="btn sec" ${S.step===0?"disabled style='visibility:hidden'":""} onclick="S.step--;render();scrollTo(0,0)">${t("back")}</button>`+(S.step<3?`<button class="btn pri" onclick="nextStep()">${t("next")}</button>`:`<button class="btn pri" onclick="submitReq()">${t("submit")}</button>`)+`</div></div>`;

function pwiz(){
 const p=S.p;fixP();const st=["プラン・料金","お車・お客様","確認・同意","署名・送信"],se=["Plan & price","Vehicle & you","Review & agree","Sign & send"];
 let h=`<div class="steps">${st.map((n,i)=>`<div class="st ${i===S.ps?"on":i<S.ps?"done":""}"><i>${i<S.ps?"✓":i+1}</i><span>${L2(n,se[i])}</span></div>`).join("")}</div><div class="card">`;
 if(S.ps===0){const pr=price(p),rg=p.plan==="bc"&&p.cls<5?REG[p.opt]?.[p.cls]:0,rn=RNG[p.opt];

 if(S.ps===1){h+=`<div class="grid">${pin("plate",L2("登録番号","Registration no."),"text","佐賀 300 あ 12-34")}${pin("car",L2("車種名","Car model"),"text")}${pin("expiry",L2("車検満了日","Shaken expiry date"),"date")}<label class="f">${L2("担当店舗","Preferred store")}<select onchange="S.p.store=+this.value">${STORES.map((s,i)=>`<option value="${i}" ${p.store===i?"selected":""}>${sn(i)}</option>`).join("")}</select></label>${pin("name",t("name"),"text")}${pin("kana",t("kana"),"text")}${pin("zip",t("zip"),"text","840-0801")}${pin("tel",t("tel"),"tel")}</div><div style="margin-top:14px">${pin("addr",t("addr"),"text")}</div>`
  +(p.plan!=="pc"?chk("S.p.coat=this.checked?1:0",p.coat,L2("次のいずれかのコーティングを施工済みです：CPCプレミアムコーティングエクスGN／ダブルGN、グラスコーティングガードコスメSP、CPCペイントシーラント","My car has one of these coatings: CPC Premium Coating EX GN / Double GN, Glass Coating Guard Cosme SP, CPC Paint Sealant")):"")}
 if(S.ps===2){h+=TT.map((x,i)=>`<div style="margin:8px 0"><b>${L2(x[0],x[1])}</b><div class="mut">${L2(x[2],x[3])}</div>${chk(`S.p.terms[${i}]=this.checked?1:0`,p.terms[i],L2("同意します","I agree"))}</div>`).join("")
  +`<div class="hint"><b>${L2("解約金の目安","Cancellation estimate")}</b><br>${L2("実施済みの整備費用（円）","Cost of services already used (¥)")}: <input type="text" inputmode="numeric" style="width:130px" value="${p.used}" oninput="S.p.used=+this.value||0;document.getElementById('rf').textContent=yen(rf())"> → ${L2("解約金","Refund")} <b id="rf">${yen(rf())}</b></div>`}
 if(S.ps===3){h+=`<h2 style="margin-top:0">${t("review")}</h2>${psum(p)}<h2>${t("sigT")}</h2><canvas id="sig" aria-label="${t("sigT")}"></canvas><div class="row" style="margin-top:8px"><span class="mut">${t("sigNote")}${new Date().toLocaleDateString(S.lang==="ja"?"ja-JP":"en-GB")}</span><button class="btn sec" onclick="clearSig()">${t("clear")}</button></div>`}
 return h+`<div class="row"><button class="btn sec" ${S.ps===0?"style='visibility:hidden'":""} onclick="S.ps--;render();scrollTo(0,0)">${t("back")}</button>`+(S.ps<3?`<button class="btn pri" onclick="pnext()">${t("next")}</button>`:`<button class="btn pri" onclick="psubmit()">${t("submit")}</button>`)+`</div></div>`;

 if(S.psel)return pdetail(PQ.find(x=>x.id===S.psel));

}
function pdetail(q){const p=q.p;let a="";
 if(q.st==="pending")a=`<div class="grid"><label class="f">${L2("有効開始日","Start date")}<input type="date" id="pst" value="${new Date().toISOString().slice(0,10)}"></label><label class="f">${L2("有効終了日（車検満了日）","End date (shaken expiry)")}<input type="date" id="pen" value="${p.expiry}"></label></div><label class="chk"><input type="checkbox" id="ppd"><span>${L2("全額のお支払いを確認しました","Full payment received")} (${yen(price(p))})</span></label><label class="f">${t("noteIn")}<textarea id="pnt" rows="2"></textarea></label><div class="row"><button class="btn bad" onclick="pset('${q.id}','rejected')">${t("reject")}</button><button class="btn pri" onclick="pset('${q.id}','active')">${L2("承認して有効化","Approve & activate")}</button></div>`;
 if(q.st==="active")a=`<div class="mut">${q.start} 〜 ${q.end}</div>`+vlist(q,visits(p))+`<div class="row"><span></span><button class="btn pri" onclick="pvisit('${q.id}')">${L2("入庫完了を記録","Record completed visit")}</button></div>`;
 return `<div class="top"><h1>${q.id}</h1>${pbadge(q.st)}</div><div class="card">${psum(p)}<dl class="kv"><dt>${t("sig")}</dt><dd>${p.sig?`<img src="${p.sig}" alt="${t("sec")}" style="max-width:260px;background:#fff;border:1px solid var(--line);border-radius:6px">`:"—"}</dd></dl></div><div class="card">${a||"—"}</div><button class="btn sec" onclick="S.psel=null;render()">← ${t("close")}</button>`}
function pset(id,st){const q=PQ.find(x=>x.id===id);q.note=document.getElementById("pnt").value;

 q.st=st;savePQ();render()}
function pvisit(id){const q=PQ.find(x=>x.id===id),n=visits(q.p).find(s=>!q.done.includes(s[0]));if(n){q.done.push(n[0]);savePQ();render()}}

 return `<div class="top"><h1>${t("id")} ${r.id}</h1>${stLabel(r.st)}</div>${timeline(r.st)}${docList(docs)}

function psum(p){return `<dl class="kv"><dt>${L2("申込日","Application date")}</dt><dd>${rw(today())}</dd><dt>${L2("プラン","Plan")}</dt><dd>${L2(PLAN[p.plan][0],PLAN[p.plan][1])}</dd><dt>${L2("加入コース","Course")}</dt><dd>${L2(OPT[p.opt].a,OPT[p.opt].b)} / ${L2(CLS[p.cls][0],CLS[p.cls][1])}${p.other?L2("（他社購入車）"," (other dealer)"):""}</dd><dt>${L2("申込書コード","Form code")}</dt><dd><b>${code(p)}</b></dd><dt>${L2("料金（税込）","Price (tax incl.)")}</dt><dd><b>${yen(price(p))}</b></dd><dt>${L2("車種","Car model")}</dt><dd>${esc(p.car)}</dd><dt>${L2("登録番号","Registration no.")}</dt><dd>${esc(plt(p))}</dd><dt>${L2("登録日・更新日 〜 車検満了日","Registered/renewed 〜 shaken expiry")}</dt><dd>${rw(p.reg)} 〜 ${rw(p.expiry)}</dd>${hasShk(p)?`<dt>${t("chassis")}</dt><dd>${esc(p.chassis)||"—"}</dd>`:""}<dt>${L2("お申込み氏名","Applicant")}</dt><dd>${esc(p.name)} (${esc(p.kana)})</dd><dt>${L2("ご住所","Address")}</dt><dd>〒${esc(p.zip)} ${esc(p.addr)} / ${esc(p.tel)}</dd><dt>${L2("担当店舗","Store")}</dt><dd>${sn(p.store)}</dd></dl><div class="mut">${L2("※追加整備費用および車両引取・納車料は別途申し受けます。","※Additional maintenance and vehicle pick-up/delivery fees are charged separately.")}</div>`}
function pwiz(){
 const p=S.p;fixP();const st=["プラン・料金","お車・お客様","確認・同意","署名・送信"],se=["Plan & price","Vehicle & you","Review & agree","Sign & send"];

 if(S.ps===0){const pr=price(p),rg=p.plan==="bc"&&p.cls<5?REG[p.opt]?.[p.cls]:0,rn=RNG[p.opt];

  +(p.join==="n"?chk("S.p.other=this.checked?1:0",p.other,L2("他社で購入した新車（新車コース（他社））","New car bought from another dealer (New-car course – other dealers)")):"")
  +`<div class="hint" style="margin-top:12px"><span class="pr">${yen(pr)}</span> ${L2("（税込・全額前払い）","(tax incl., prepaid in full)")}<br>${L2("申込書コード","Form code")}: <b>${code(p)}</b>${rg?`<br>${L2("通常料金","Regular price")} ${yen(rg)} ／ <b>${L2("こんなにお得","You save")} ${yen(rg-pr)}</b> <span class="mut">${L2("（通常料金はクラス毎の代表的な車種の料金です）","(regular price is for a representative model of each class)")}</span>`:""}<br>${L2(`対象：${rn[0]}〜${rn[1]}ヶ月目`,`Covers: month ${rn[0]}–${rn[1]}`)}${rn[1]>=36?L2("・車検基本料金込み","; shaken base fee included"):""}</div><div class="mut">${L2("※追加整備費用および車両引取・納車料は別途申し受けます。クラスごとの車種は「プラン・特典」をご覧ください。","※Additional maintenance and pick-up/delivery fees are extra. See Plans & benefits for models in each class.")}</div>`}
 if(S.ps===1){h+=`<h2 style="margin-top:0">${L2("お車","Your car")}</h2><div class="grid">${pin("pa",L2("登録番号：地域名","Plate: region"),"text")}${pin("pc",L2("分類番号（3桁）","Class no. (3 digits)"),"text","300")}${pin("pk",L2("ひらがな（1文字）","Hiragana (1 char)"),"text","あ")}${pin("pn",L2("一連番号（4桁）","Serial no. (4 digits)"),"text","1234")}${pin("car",L2("車種","Car model"),"text")}${pin("reg",L2("登録日・更新日","Registration / renewal date"),"date")}${pin("expiry",L2("車検満了日","Shaken expiry date"),"date")}<label class="f">${L2("担当店舗","Preferred store")}<select onchange="S.p.store=+this.value">${STORES.map((s,i)=>`<option value="${i}" ${p.store===i?"selected":""}>${sn(i)}</option>`).join("")}</select></label></div><h2>${L2("お申込み者（お客様ご自身でご記入ください）","Applicant (please fill in yourself)")}</h2><div class="grid">${pin("name",L2("お申込み氏名","Applicant name"),"text")}${pin("kana",t("kana"),"text")}${pin("zip",t("zip"),"text","840-0801")}${pin("tel",t("tel"),"tel")}</div><div style="margin-top:14px">${pin("addr",t("addr"),"text")}</div>`
  +(p.plan!=="pc"?chk("S.p.coat=this.checked?1:0",p.coat,L2("次のいずれかのコーティングを施工済みです：CPCプレミアムコーティングエクスGN／ダブルGN、グラスコーティングガードコスメSP、CPCペイントシーラント","My car has one of these coatings: CPC Premium Coating EX GN / Double GN, Glass Coating Guard Cosme SP, CPC Paint Sealant")):"")}
 if(S.ps===2){h+=`<div class="mut">${L2("ご来店ください。お客様ご自身でお車の持ち込み・引取りをいただくことで特別料金としています。適用項目以外は別途料金となります。","Please visit in person: special rates apply when you bring and collect your car yourself. Items outside the plan are charged separately.")}</div>`+TT.map((_,i)=>{const x=tt(p,i);return `<div style="margin:8px 0"><b>${L2(x[0],x[1])}</b><div class="mut">${L2(x[2],x[3])}</div>${chk(`S.p.terms[${i}]=this.checked?1:0`,p.terms[i],L2("同意します","I agree"))}</div>`}).join("")
  +`<div class="hint"><b>${L2("解約金の目安","Cancellation estimate")}</b><br>${L2("実施済みの整備費用（円）","Cost of services already used (¥)")}: <input type="text" inputmode="numeric" style="width:130px" value="${p.used}" oninput="S.p.used=+this.value||0;document.getElementById('rf').textContent=yen(rf())"> → ${L2("解約金","Refund")} <b id="rf">${yen(rf())}</b></div>`+(hasShk(p)?shk(p,"S.p",plt(p)):"")+antB(p,"S.p")}
 if(S.ps===3){h+=`<h2 style="margin-top:0">${t("review")}</h2>${psum(p)}<h2>${t("sigT")}</h2><canvas id="sig" aria-label="${t("sigT")}"></canvas><div class="row" style="margin-top:8px"><span class="mut">${t("sigNote")}${rw(today())}<br>${L2("この署名は、スマイルパスポート申込書・確認書"+(hasShk(p)?"・放置違反金滞納情報照会同意書／継続検査確認事項及び承諾書":"")+"に適用されます。","This signature applies to the Smile Passport application, the confirmation"+(hasShk(p)?", and the parking-fine consent / continued-inspection confirmation":"")+".")}</span><button class="btn sec" onclick="clearSig()">${t("clear")}</button></div>`}
 return h+`<div class="row"><button class="btn sec" ${S.ps===0?"style='visibility:hidden'":""} onclick="S.ps--;render();scrollTo(0,0)">${t("back")}</button>`+(S.ps<3?`<button class="btn pri" onclick="pnext()">${t("next")}</button>`:`<button class="btn pri" onclick="psubmit()">${t("submit")}</button>`)+`</div></div>`;

function pnext(){const p=S.p;let e="";
 if(S.ps===1){if(!p.pa||!p.pc||!p.pk||!p.pn||!p.car||!p.reg||!p.expiry||!p.name||!p.kana||!p.zip||!p.addr||!p.tel)e=t("errReq");
  else if(!/^\d{3}$/.test(p.pc)||!/^[ぁ-んァ-ヶA-Za-z]$/.test(p.pk)||!/^[0-9・.]{1,4}$/.test(p.pn))e=L2("登録番号の形式をご確認ください（分類番号3桁・ひらがな1文字・一連番号4桁）。","Please check the plate: 3-digit class no., 1 hiragana, up to 4-digit serial.");
  else if(!/^\d{3}-?\d{4}$/.test(p.zip))e=L2("郵便番号は 840-0801 の形式で入力してください。","Postal code format: 840-0801.");
  else if(p.expiry<p.reg)e=t("errDate");
  else if(p.plan!=="pc"&&!p.coat)e=L2("ボデーケアは対象コーティングの施工が必要です。","Body Care requires one of the listed coatings.")}
 if(S.ps===2){if(p.terms.includes(0)||p.ant.includes(0))e=t("errAgree");else if(hasShk(p)&&(!p.ctype||!p.fine||!p.chassis.trim()))e=t("errCt")}
 if(e)return toast(e);S.ps++;render();scrollTo(0,0)}
function psubmit(){if(!S.p.sig)return toast(t("errSig"));S.p.plate=pltC(S.p);PQ.unshift({id:"P-"+(2001+PQ.length),st:"pending",p:S.p,start:"",end:"",done:[],note:"",kbn:"",hq:"",insp:{},appDate:today()});savePQ();S.p=pblank();S.ps=0;S.pt="my";render();scrollTo(0,0);toast(L2("お申込みを受け付けました。店頭でお支払い・ご確認をお願いします。","Application received. Please pay and confirm in store."))}
function pcard(q,stf){const p=q.p;return `<div class="card ${stf?"req":""}" ${stf?`tabindex="0" onclick="S.psel='${q.id}';render();scrollTo(0,0)"`:""}><div class="top"><b>${L2(PLAN[p.plan][0],PLAN[p.plan][1])} <span class="mut">${q.id}</span></b>${pbadge(q.st)}</div><div class="mut">${stf?esc(p.name)+" ・ ":""}${L2(OPT[p.opt].a,OPT[p.opt].b)} ・ ${L2(CLS[p.cls][0],CLS[p.cls][1])} ・ ${yen(price(p))} ・ ${L2("コード","Code")} ${code(p)}</div>${q.st==="active"&&!stf?`<div class="mut">${L2("有効期間","Valid")}: ${rw(q.start)} 〜 ${rw(q.end)}</div>${vlist(q,visits(p))}`:""}${q.st==="pending"&&!stf?`<div class="mut">${L2("店頭でのお支払い確認後に有効になります。","Becomes active after payment is confirmed in store.")}</div>`:""}${stf&&q.hq?`<div class="mut">✓ ${L2("営業本部へ送付済み","Sent to sales HQ")} ${rw(q.hq)}</div>`:""}${q.note?`<p><b>${t("note")}:</b> ${esc(q.note)}</p>`:""}${!stf?`<details><summary class="mut" style="cursor:pointer">${L2("お客様控え・住所変更","Customer copy / change address")}</summary>${psum(p)}<div class="grid"><label class="f">${t("zip")}<input type="text" id="az${q.id}" value="${esc(p.zip)}"></label><label class="f">${t("addr")}<input type="text" id="ad${q.id}" value="${esc(p.addr)}"></label></div><div class="row"><span class="mut">${L2("ハガキでのご案内のため、転居の際は必ずご連絡ください。","Please tell us when you move so reminder postcards reach you.")}</span><button class="btn sec" onclick="paddr('${q.id}')">${L2("住所を変更","Update address")}</button></div></details>`:""}</div>`}
function paddr(id){const q=PQ.find(x=>x.id===id),z=document.getElementById("az"+id).value,a=document.getElementById("ad"+id).value;if(!/^\d{3}-?\d{4}$/.test(z)||!a)return toast(t("errReq"));q.p.zip=z;q.p.addr=a;savePQ();toast(L2("住所を更新しました。","Address updated."));render()}
function pdetail(q){const p=q.p,docs=[["スマイルパスポート申込書（店舗→営業本部）2026.10改定","Smile Passport application (store → sales HQ), rev. 2026.10",p.terms.every(x=>x)],["確認書（暴力団排除）","Anti-organized-crime confirmation",p.ant.every(x=>x)]].concat(hasShk(p)?[["放置違反金滞納情報照会における同意書／継続検査確認事項及び承諾書","Parking-fine consent / continued-inspection confirmation",!!p.fine&&!!p.chassis],["放置違反金滞納情報照会書（整備事業者用）","Parking-fine inquiry sheet (dealer)",!!(q.insp&&q.insp.rs)]]:[]);let a="";
 if(q.st==="pending"){const s0=p.reg||today(),e0=p.opt==="new54"&&p.reg?addM(p.reg,54):p.expiry;a=`<div class="grid"><label class="f">${L2("有効期間：開始（登録日・更新日）","Valid from (registration/renewal date)")}<input type="date" id="pst" value="${s0}"></label><label class="f">${L2("有効期間：終了（車検満了日）","Valid until (shaken expiry)")}<input type="date" id="pen" value="${e0}"></label><label class="f">${L2("契約区分","Contract category")}<input type="text" id="pkb" value="${esc(q.kbn||"")}"></label><span></span></div><label class="chk"><input type="checkbox" id="ppd"><span>${L2("全額のお支払いを確認しました","Full payment received")} (${yen(price(p))})</span></label><label class="f">${t("noteIn")}<textarea id="pnt" rows="2"></textarea></label><div class="row"><button class="btn bad" onclick="pset('${q.id}','rejected')">${t("reject")}</button><button class="btn pri" onclick="pset('${q.id}','active')">${L2("承認して有効化","Approve & activate")}</button></div>`}
 if(q.st==="active")a=`<div class="mut">${rw(q.start)} 〜 ${rw(q.end)} ・ ${L2("契約区分","Category")}: ${esc(q.kbn||"—")}</div>`+vlist(q,visits(p))+`<div class="row"><span class="mut">${q.hq?"✓ "+L2("営業本部へ送付済み","Sent to sales HQ")+" "+rw(q.hq):""}</span><div><button class="btn sec" onclick="phq('${q.id}')">${L2("営業本部へ送付","Send to sales HQ")}</button> <button class="btn pri" onclick="pvisit('${q.id}')">${L2("入庫完了を記録","Record completed visit")}</button></div></div>`;
 return `<div class="top"><h1>${q.id}</h1>${pbadge(q.st)}</div>${docList(docs)}<div class="card">${psum(p)}<dl class="kv"><dt>${L2("同意","Consents")}</dt><dd>${p.terms.every(x=>x)&&p.ant.every(x=>x)?`<span class="badge s-allotted">✓ ${t("agreed")}</span>`:`<span class="badge s-rejected">${t("notag")}</span>`}${hasShk(p)?` ・ ${t("ct")}: ${p.ctype?t(p.ctype):"—"} ・ e-filing: ${p.ep.map(x=>x?"✓":"–").join(" ")}`:""}</dd><dt>${t("sig")}</dt><dd>${p.sig?`<img src="${p.sig}" alt="${t("sec")}" style="max-width:260px;background:#fff;border:1px solid var(--line);border-radius:6px"> <div class="mut">${rw(q.appDate||today())}</div>`:"—"}</dd></dl></div><div class="card">${a||"—"}</div>${hasShk(p)?`<div class="card">${inspUI(q,"p")}</div>`:""}<button class="btn sec" onclick="S.psel=null;render()">← ${t("close")}</button>`}

 if(st==="active"){const a=document.getElementById("pst").value,b=document.getElementById("pen").value;if(!document.getElementById("ppd").checked||!a||!b||b<a)return toast(L2("支払い確認と有効期間の入力が必要です。","Confirm payment and enter valid dates."));q.start=a;q.end=b;q.kbn=document.getElementById("pkb").value}

/* normalise any data saved by the earlier version */
R.forEach(r=>{r.f=Object.assign(blank(),r.f);r.f.ep=[...r.f.ep,0,0,0].slice(0,3);r.insp=r.insp||{};if(r.id==="R-1001"&&!r.f.chassis)Object.assign(r.f,{accept:1,chassis:"MXUA80-0012345",ep:[1,1,1]})});
PQ.forEach(q=>{q.p=Object.assign(pblank(),q.p);q.p.ep=[...q.p.ep,0,0,0].slice(0,3);q.insp=q.insp||{};q.kbn=q.kbn||"";q.hq=q.hq||"";if(q.id==="P-2001"&&!q.p.reg)Object.assign(q.p,{reg:"2026-10-31",pa:"佐賀",pc:"300",pk:"さ",pn:"1234",ant:[1,1],ctype:"reg",fine:1,ep:[1,1,1],chassis:"MXUA80-0054321"})});
